<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 210" width="960" height="210" fill="none" role="img" aria-label="ProshnoPatra — Exam and Question Paper Maker for Bangladesh">
  <defs>
    <pattern id="grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E4E4E7" stroke-width="0.6" stroke-opacity="0.7" />
    </pattern>
    <linearGradient id="accent-line-light" x1="0" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F4C81" stop-opacity="0" />
      <stop offset="25%" stop-color="#0F4C81" stop-opacity="0.85" />
      <stop offset="75%" stop-color="#18181B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#18181B" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="fade-right-light" x1="560" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAFAFA" stop-opacity="0" />
      <stop offset="100%" stop-color="#F4F4F5" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Outer card surface -->
  <rect x="1" y="1" width="958" height="208" rx="18" fill="#FAFAFA" stroke="#E4E4E7" stroke-width="1.5" />
  <rect x="2" y="2" width="956" height="206" rx="17" fill="url(#grid-light)" />
  <rect x="560" y="2" width="398" height="206" rx="17" fill="url(#fade-right-light)" />

  <!-- Subtle top accent hairline -->
  <rect x="48" y="1" width="864" height="2.5" rx="1.25" fill="url(#accent-line-light)" />

  <!-- Left brand icon (exact ProshnoPatra mark) -->
  <g transform="translate(52, 49)">
    <rect width="112" height="112" rx="25" fill="#18181B" />
    <rect x="25.5" y="19.25" width="61.25" height="73.5" rx="5" fill="#FFFFFF" />
    <rect x="34.2" y="28.9" width="28.9" height="3.5" rx="1.75" fill="#18181B" />
    <rect x="34.2" y="36.3" width="43.75" height="2.2" rx="1.1" fill="#D4D4D8" />
    <rect x="34.2" y="41.6" width="35.9" height="2.2" rx="1.1" fill="#D4D4D8" />
    <line x1="34.2" y1="49.4" x2="77.9" y2="49.4" stroke="#18181B" stroke-width="1.4" stroke-linecap="round" />
    <line x1="34.2" y1="51.7" x2="77.9" y2="51.7" stroke="#18181B" stroke-width="0.7" stroke-linecap="round" />
    <path d="M37.6 60.4 H53.8 L45.5 70 L54.2 79.6 H37.6" stroke="#0F4C81" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="60.4" y="62.6" width="16.6" height="3.1" rx="1.55" fill="#18181B" />
    <rect x="60.4" y="69.1" width="16.6" height="1.5" rx="0.75" fill="#0F4C81" />
    <rect x="60.4" y="73.5" width="12.25" height="3.1" rx="1.55" fill="#18181B" />
  </g>

  <!-- Brand title & editorial subtitle -->
  <g transform="translate(188, 0)">
    <text x="0" y="96" fill="#09090B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.4">ProshnoPatra</text>
    <text x="2" y="128" fill="#52525B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="0.1">Open-source A4 exam &amp; question paper studio for Bangladesh</text>

    <!-- Minimal capability strip -->
    <g transform="translate(2, 146)">
      <rect x="0" y="0" width="84" height="22" rx="5" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1" />
      <text x="42" y="14.5" text-anchor="middle" fill="#18181B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">CQ &amp; MCQ</text>

      <rect x="92" y="0" width="96" height="22" rx="5" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1" />
      <text x="140" y="14.5" text-anchor="middle" fill="#0F4C81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">KaTeX Math</text>

      <rect x="196" y="0" width="96" height="22" rx="5" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1" />
      <text x="244" y="14.5" text-anchor="middle" fill="#18181B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Offline PWA</text>

      <rect x="300" y="0" width="82" height="22" rx="5" fill="#0F4C81" />
      <text x="341" y="14.5" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">A4 PDF</text>
    </g>
  </g>

  <!-- Right architectural miniature A4 board sheet preview -->
  <g transform="translate(744, 24)">
    <!-- Soft paper shadow -->
    <rect x="6" y="8" width="156" height="162" rx="6" fill="#18181B" fill-opacity="0.06" />
    <!-- A4 Sheet -->
    <rect x="0" y="0" width="156" height="162" rx="6" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.2" />

    <!-- Subject code boxes [1][3][6] -->
    <rect x="14" y="12" width="12" height="11" rx="1.5" fill="none" stroke="#71717A" stroke-width="0.9" />
    <rect x="26" y="12" width="12" height="11" rx="1.5" fill="none" stroke="#71717A" stroke-width="0.9" />
    <rect x="38" y="12" width="12" height="11" rx="1.5" fill="none" stroke="#71717A" stroke-width="0.9" />
    <text x="20" y="20.5" text-anchor="middle" fill="#18181B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="700">1</text>
    <text x="32" y="20.5" text-anchor="middle" fill="#18181B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="700">3</text>
    <text x="44" y="20.5" text-anchor="middle" fill="#18181B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" font-weight="700">6</text>

    <!-- Board header lines -->
    <rect x="44" y="30" width="68" height="6" rx="3" fill="#18181B" />
    <rect x="56" y="40" width="44" height="3.5" rx="1.75" fill="#A1A1AA" />
    <!-- Double board rule -->
    <line x1="14" y1="51" x2="142" y2="51" stroke="#18181B" stroke-width="1.4" />
    <line x1="14" y1="54" x2="142" y2="54" stroke="#18181B" stroke-width="0.6" />

    <!-- Stem lines -->
    <rect x="14" y="63" width="118" height="3.5" rx="1.75" fill="#52525B" />
    <rect x="14" y="71" width="96" height="3.5" rx="1.75" fill="#A1A1AA" />

    <!-- Inline equation highlight -->
    <rect x="14" y="81" width="66" height="15" rx="3" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.8" />
    <text x="47" y="91.5" text-anchor="middle" fill="#0F4C81" font-family="Georgia, 'Times New Roman', serif" font-size="9.5" font-style="italic" font-weight="700">s = ut + ½at²</text>

    <!-- Sub-questions with right-aligned marks -->
    <rect x="20" y="105" width="84" height="3" rx="1.5" fill="#71717A" />
    <text x="140" y="108.5" text-anchor="end" fill="#18181B" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700">1</text>

    <rect x="20" y="117" width="94" height="3" rx="1.5" fill="#71717A" />
    <text x="140" y="120.5" text-anchor="end" fill="#18181B" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700">2</text>

    <rect x="20" y="129" width="78" height="3" rx="1.5" fill="#71717A" />
    <text x="140" y="132.5" text-anchor="end" fill="#18181B" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700">3</text>

    <rect x="20" y="141" width="98" height="3" rx="1.5" fill="#71717A" />
    <text x="140" y="144.5" text-anchor="end" fill="#18181B" font-family="ui-monospace, monospace" font-size="7.5" font-weight="700">4</text>
  </g>
</svg>
